version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: elearn_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: elearn_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: elearn_server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/ai-elearning
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: elearn_client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo_data:
